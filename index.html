<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문학 마당</title>
<meta name="description" content="모의고사 문학 작품 사전과 개념어 사전. 고1부터 고3까지.">
<meta name="theme-color" content="#f6f6f3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3; --paper:#ffffff; --ink:#17181b; --ink2:#4a4d55; --ink3:#81848c;
  --line:#e3e3de; --line2:#cfd0ca; --soft:#efefea;
  --accent:#2747b8; --accent-soft:#e8ecfa; --ok:#1f7a4d; --ok-soft:#e3f2ea; --no:#b3261e; --no-soft:#fbe9e7;
  --g-poem:#2f62d6; --g-novel:#1c8a5a; --g-gsg:#c47a12; --g-gsn:#c2410c; --g-essay:#7c4dcc; --g-drama:#0e8a8a;
  --display:"Noto Serif KR",serif; --body:"IBM Plex Sans KR",system-ui,sans-serif;
  --old:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Serif CJK KR","Source Han Sans K",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,20,30,.04),0 4px 18px rgba(20,20,30,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --paper:#1a1c20; --ink:#ececee; --ink2:#b5b7bd; --ink3:#83868e;
    --line:#2a2d33; --line2:#3a3e46; --soft:#22252a;
    --accent:#8ea6ff; --accent-soft:#232b48; --ok:#5fcf97; --ok-soft:#173226; --no:#ff8a80; --no-soft:#3a1c1a;
    --g-poem:#7aa2ff; --g-novel:#4fcf93; --g-gsg:#f0b445; --g-gsn:#ff8a50; --g-essay:#b597ff; --g-drama:#45cccc;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --paper:#1a1c20; --ink:#ececee; --ink2:#b5b7bd; --ink3:#83868e;
  --line:#2a2d33; --line2:#3a3e46; --soft:#22252a;
  --accent:#8ea6ff; --accent-soft:#232b48; --ok:#5fcf97; --ok-soft:#173226; --no:#ff8a80; --no-soft:#3a1c1a;
  --g-poem:#7aa2ff; --g-novel:#4fcf93; --g-gsg:#f0b445; --g-gsn:#ff8a50; --g-essay:#b597ff; --g-drama:#45cccc;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.old{font-family:var(--old)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.nav{display:flex;gap:4px;margin-left:8px}
.nav a{padding:6px 12px;border-radius:999px;color:var(--ink2);font-size:15px;white-space:nowrap}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav a:not(.on):hover{background:var(--soft)}
.sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn svg{width:18px;height:18px}

/* search */
.search{position:relative}
.search input{width:100%;height:52px;border:1px solid var(--line2);background:var(--paper);border-radius:999px;padding:0 20px 0 48px;font:inherit;font-size:16px;color:var(--ink);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search>svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink3);pointer-events:none}
.sres{position:absolute;left:0;right:0;top:58px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.12);overflow:hidden;z-index:30;max-height:60vh;overflow-y:auto}
.sres[hidden]{display:none}
.sres a{display:flex;gap:12px;align-items:baseline;padding:12px 18px;border-top:1px solid var(--line)}
.sres a:first-child{border-top:0}
.sres a:hover,.sres a.hl{background:var(--soft)}
.sres .k{font-size:12px;color:var(--ink3);flex:none;width:44px}
.sres b{font-weight:600}
.sres .s{color:var(--ink3);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sres .none{padding:16px 18px;color:var(--ink3)}

/* home */
.hero{padding:64px 0 36px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.25;letter-spacing:-.03em;margin:0 0 12px}
.hero p{color:var(--ink2);margin:0 0 28px;font-size:17px}
.hero .search{max-width:620px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick a{font-size:14px;color:var(--ink2);padding:4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.quick a:hover{border-color:var(--ink3)}
section{margin:44px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-h a{font-size:14px;color:var(--ink3)}
.sec-h a:hover{color:var(--accent)}
.genres{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.genre{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.genre:hover{border-color:var(--line2);transform:translateY(-1px)}
.genre b{font-size:16px;font-weight:600}
.genre span{font-size:13px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--c,var(--ink3))}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.group h3{margin:0 0 10px;font-size:15px;font-weight:600;display:flex;justify-content:space-between}
.group h3 small{color:var(--ink3);font-weight:400}
.group .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13.5px;padding:3px 10px;border-radius:8px;background:var(--soft);color:var(--ink2);max-width:100%}
a.tag:hover{background:var(--accent-soft);color:var(--accent)}
.note{background:var(--paper);border:1px dashed var(--line2);border-radius:var(--r);padding:16px 18px;color:var(--ink2);font-size:14.5px}
.foot{border-top:1px solid var(--line);margin-top:72px;padding:28px 0 48px;color:var(--ink3);font-size:13.5px}
.foot a{text-decoration:underline;text-underline-offset:3px}

/* lists */
.page-h{padding:40px 0 8px}
.page-h h1{font-family:var(--display);font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.03em;margin:0 0 6px}
.page-h p{margin:0;color:var(--ink2)}
.filters{display:flex;flex-direction:column;gap:10px;margin:24px 0 18px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow .lab{font-size:13px;color:var(--ink3);width:40px;flex:none}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.6}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;color:var(--ink3);font-size:14px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card .meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3);flex-wrap:wrap}
.card h3{margin:0;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.card h3 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--ink2);margin-left:8px;letter-spacing:0}
.card p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.6}
.badge{font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--ink3);font-weight:500}
.badge.ex{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--ink3);background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.tlist{display:flex;flex-direction:column;gap:28px}
.tgroup h2{font-family:var(--display);font-size:18px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.tgroup h2 small{font-family:var(--body);color:var(--ink3);font-size:13px;font-weight:400}
.trows{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) 20px;gap:16px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow:hover{background:var(--soft)}
.trow b{font-weight:600}
.trow span{color:var(--ink2);font-size:14.5px}
.trow svg{width:16px;height:16px;color:var(--ink3)}

/* detail */
.crumb{padding-top:28px;font-size:14px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.crumb a:hover{color:var(--accent)}
.d-head{padding:16px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.d-head .meta{display:flex;gap:10px;align-items:center;color:var(--ink3);font-size:14px;flex-wrap:wrap}
.d-head h1{font-family:var(--display);font-size:clamp(32px,6vw,52px);font-weight:700;letter-spacing:-.035em;line-height:1.2;margin:10px 0 8px}
.d-head .by{font-size:17px;color:var(--ink2)}
.d-head .lede{font-family:var(--display);font-size:clamp(18px,2.4vw,21px);line-height:1.6;margin:18px 0 0;max-width:720px}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.d-main>section:first-child{margin-top:0}
.d-side{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.box h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.02em}
.kv{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px 12px;font-size:14.5px;margin:0}
.kv dt{color:var(--ink3)}
.kv dd{margin:0}
h2.h{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2.h .num{font-family:var(--body);font-size:12px;color:var(--ink3);font-weight:500;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.words{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.word{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.word b{font-family:var(--display);font-weight:600}
.word span{color:var(--ink2)}
.feats{display:flex;flex-direction:column;gap:10px}
.feat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.feat a.t{flex:none;font-size:13.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:8px;white-space:nowrap;margin-top:2px}
.feat p{margin:0;color:var(--ink2)}
.points{margin:0;padding:0;list-style:none;counter-reset:p}
.points li{counter-increment:p;position:relative;padding:10px 0 10px 36px;border-bottom:1px solid var(--line)}
.points li::before{content:counter(p);position:absolute;left:0;top:11px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;display:grid;place-items:center;font-weight:600}
.orig{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;font-family:var(--display);font-size:17px;line-height:2;white-space:pre-wrap}
.orig .src{display:block;font-family:var(--body);font-size:13px;color:var(--ink3);line-height:1.5;margin-top:14px;white-space:normal}
.exams{display:flex;flex-direction:column;gap:8px}
.exam{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14.5px}
.exam b{font-weight:600}
.exam .with{color:var(--ink3);font-size:13.5px}
.pending{display:flex;gap:14px;align-items:flex-start;background:var(--soft);border-radius:var(--r);padding:16px 18px;color:var(--ink2);font-size:14.5px}
.pending svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--ink3)}
.t-short{font-family:var(--display);font-size:clamp(19px,2.6vw,23px);line-height:1.55;margin:16px 0 0;max-width:720px}
.desc{white-space:pre-line;font-size:16.5px;line-height:1.85;margin:0}
.ex-box{border-left:3px solid var(--accent);background:var(--paper);border-radius:0 var(--r) var(--r) 0;padding:16px 20px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.ex-box q{display:block;font-family:var(--display);font-size:17.5px;line-height:1.8;quotes:none;white-space:pre-line}
.ex-box cite{display:block;font-style:normal;font-size:13.5px;color:var(--ink3);margin-top:8px}
.vs{display:flex;flex-direction:column;gap:10px}
.vs a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}
.vs a:hover{border-color:var(--accent)}
.vs .pair{font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.vs .pair em{font-style:normal;color:var(--ink3);font-weight:400;font-size:13px}
.vs span{color:var(--ink2);font-size:14.5px}
.ox{display:flex;flex-direction:column;gap:10px}
.oxq{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.oxq p{margin:0 0 12px}
.oxb{display:flex;gap:8px}
.oxb button{width:52px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:18px;font-weight:600}
.oxb button:hover{border-color:var(--ink3)}
.oxq.done .oxb button{pointer-events:none;opacity:.45}
.oxq.done .oxb button.pick{opacity:1}
.oxq.right{border-color:var(--ok)}
.oxq.wrong{border-color:var(--no)}
.oxr{margin-top:12px;font-size:14.5px;padding:10px 14px;border-radius:10px}
.oxr[hidden]{display:none}
.right .oxr{background:var(--ok-soft)}
.wrong .oxr{background:var(--no-soft)}
.oxr b{margin-right:6px}
.right .oxr b{color:var(--ok)}
.wrong .oxr b{color:var(--no)}
.mini{display:flex;flex-direction:column;gap:8px}
.mini a{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.mini a:last-child{border-bottom:0}
.mini a:hover b{color:var(--accent)}
.mini b{font-weight:600}
.mini small{color:var(--ink3);margin-left:auto;font-size:13px;white-space:nowrap}
.alias{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}

@media (max-width:860px){
  .genres{grid-template-columns:repeat(3,minmax(0,1fr))}
  .d-grid{grid-template-columns:minmax(0,1fr);gap:28px}
  .d-side{position:static;order:-1}
  .list{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .top .wrap{gap:8px;height:56px}
  .logo{font-size:18px}
  .nav{margin-left:0}
  .nav a{padding:5px 10px;font-size:14px}
  .hero{padding:40px 0 24px}
  .hero p{font-size:15.5px}
  .genres{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow{grid-template-columns:minmax(0,1fr) 16px;gap:2px 10px;padding:12px 16px}
  .trow span{grid-column:1;grid-row:2}
  .trow svg{grid-row:1/3;grid-column:2}
  .word{grid-template-columns:minmax(0,1fr);gap:2px}
  .feat{flex-direction:column;gap:8px}
  .vs a{grid-template-columns:minmax(0,1fr);gap:4px}
  .orig{padding:20px;font-size:16px}
  .frow .lab{width:100%}
  .filters{gap:12px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#home"><i></i>문학 마당</a>
  <nav class="nav"><a href="#works" data-nav="works">작품</a><a href="#terms" data-nav="terms">개념어</a></nav>
  <div class="sp"></div>
  <button class="icon-btn" id="theme" type="button" aria-label="화면 밝기 바꾸기"></button>
</div></header>
<main id="app" class="wrap"><p style="padding:80px 0;color:var(--ink3)">불러오는 중…</p></main>
<footer class="foot"><div class="wrap" id="foot"></div></footer>
<script>
"use strict";
const GENRES=[["현대시","--g-poem"],["현대소설","--g-novel"],["고전시가","--g-gsg"],["고전소설","--g-gsn"],["수필","--g-essay"],["극","--g-drama"]];
const GC=Object.fromEntries(GENRES);
const GRADES=["고1","고2","고3"];
const ICON={
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
const GRAMMAR_URL="https://grammar-bcw.vercel.app";
let D=null, TERM={}, WORK={};
const S={g:"",era:"",grade:"",sort:"new",tg:""};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=(s,r=document)=>r.querySelector(s);
const dot=g=>`<i class="dot" style="--c:var(${GC[g]||"--ink3"})"></i>`;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* theme */
function applyTheme(t){
  if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme");
  const dark=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  $("#theme").innerHTML=dark?ICON.sun:ICON.moon;
  const m=$('meta[name="theme-color"]'); if(m) m.content=dark?"#121316":"#f6f6f3";
}
$("#theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const nx=cur==="dark"?"light":"dark"; store.set("lit-theme",nx); applyTheme(nx);
};
applyTheme(store.get("lit-theme"));

/* data helpers */
function examCount(w){return (w.exams||[]).length}
function workGrades(w){return [...new Set((w.exams||[]).map(e=>e.grade))]}
function examLabel(e){return `${e.year} ${e.grade} ${e.exam}`}
function worksUsing(tid){return D.works.filter(w=>(w.features||[]).some(f=>f.term===tid))}

function norm(s){return String(s||"").toLowerCase().replace(/\s+/g,"")}
function searchAll(q){
  q=norm(q); if(!q) return [];
  const r=[];
  for(const w of D.works){
    const hay=[w.title,w.author,w.genre].map(norm);
    let sc=0;
    if(norm(w.title).startsWith(q)) sc=10; else if(hay.some(h=>h.includes(q))) sc=6;
    else if(norm(w.summary+w.theme).includes(q)) sc=2;
    if(sc) r.push({sc,kind:"작품",href:"#work-"+w.id,title:w.title,sub:w.author+" · "+w.genre});
  }
  for(const t of D.terms){
    const names=[t.name,...(t.alias||[])].map(norm);
    let sc=0;
    if(names.some(n=>n.startsWith(q))) sc=9; else if(names.some(n=>n.includes(q))) sc=7;
    else if(norm(t.short).includes(q)) sc=2;
    if(sc) r.push({sc,kind:"개념어",href:"#term-"+t.id,title:t.name,sub:t.short});
  }
  return r.sort((a,b)=>b.sc-a.sc).slice(0,10);
}
function searchBox(ph){
  return `<div class="search" role="search">${ICON.search}<input id="q" type="search" autocomplete="off" placeholder="${esc(ph)}" aria-label="검색"><div class="sres" id="sres" hidden></div></div>`;
}
function bindSearch(){
  const inp=$("#q"), box=$("#sres"); if(!inp) return;
  let hl=-1;
  const draw=()=>{
    const v=inp.value.trim(); hl=-1;
    if(!v){box.hidden=true;return}
    const r=searchAll(v);
    box.innerHTML=r.length?r.map(x=>`<a href="${x.href}"><span class="k">${x.kind}</span><b>${esc(x.title)}</b><span class="s">${esc(x.sub)}</span></a>`).join(""):`<div class="none">'${esc(v)}'에 맞는 작품이나 개념어가 아직 없어요.</div>`;
    box.hidden=false;
  };
  inp.addEventListener("input",draw);
  inp.addEventListener("focus",draw);
  inp.addEventListener("keydown",e=>{
    const items=[...box.querySelectorAll("a")]; if(!items.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hl=(hl+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((a,i)=>a.classList.toggle("hl",i===hl))}
    else if(e.key==="Enter"){location.hash=(items[hl]||items[0]).getAttribute("href")}
    else if(e.key==="Escape"){box.hidden=true}
  });
  document.addEventListener("click",e=>{if(!e.target.closest(".search")) box.hidden=true},{once:false});
}

/* cards */
function workCard(w){
  const n=examCount(w);
  return `<a class="card" href="#work-${w.id}">
    <div class="meta">${dot(w.genre)}<span>${esc(w.genre)}</span><span>·</span><span>${esc(w.era)}</span>${n?`<span class="badge">기출 ${n}회</span>`:""}${w.sample?`<span class="badge ex">예시</span>`:""}</div>
    <h3>${esc(w.title)}<small>${esc(w.author)}</small></h3>
    <p>${esc(w.summary)}</p></a>`;
}

/* views */

  const groups={}; D.terms.forEach(t=>(groups[t.group]=groups[t.group]||[]).push(t));
  const recent=[...D.works].sort((a,b)=>(b.added||"").localeCompare(a.added||"")).slice(0,4);
  const top=[...D.works].filter(examCount).sort((a,b)=>examCount(b)-examCount(a)).slice(0,4);
  const cnt=g=>D.works.filter(w=>w.genre===g).length;

  <div class="hero">
    <h1>모의고사 문학,<br>작품과 개념어를 한곳에서.</h1>
    <p>고1부터 고3까지 학평·모평에 나온 작품을 정리하고, 선지에 나오는 개념어를 쉽게 풀었어요.</p>
    ${searchBox("작품 이름, 작가, 개념어로 찾기 (예: 진달래꽃, 역설)")}
    <div class="quick">${["역설","반어","공감각적 심상","객관적 상관물","소설의 시점"].map(n=>{const t=D.terms.find(x=>x.name===n);return t?`<a href="#term-${t.id}">${esc(n)}</a>`:""}).join("")}</div>
  </div>
  <section>
    <div class="sec-h"><h2>갈래별 작품</h2><a href="#works">전체 보기</a></div>
    <div class="genres">${GENRES.map(([g])=>`<a class="genre" href="#works" data-g="${g}">${dot(g)}<div><b>${g}</b><br><span>${cnt(g)}편</span></div></a>`).join("")}</div>
  </section>
  <section>
    <div class="sec-h"><h2>최근 추가한 작품</h2><a href="#works">작품 사전</a></div>
    <div class="list">${recent.map(workCard).join("")}</div>
  </section>
  ${top.length?`<section><div class="sec-h"><h2>자주 나온 작품</h2></div><div class="list">${top.map(workCard).join("")}</div></section>`:""}
  <section>
    <div class="sec-h"><h2>개념어 사전</h2><a href="#terms">${D.terms.length}개 모두 보기</a></div>
    <div class="groups">${Object.entries(groups).map(([g,ts])=>`<div class="group"><h3>${esc(g)}<small>${ts.length}</small></h3><div class="tags">${ts.map(t=>`<a class="tag" href="#term-${t.id}">${esc(t.name)}</a>`).join("")}</div></div>`).join("")}</div>
  </section>
  <section><div class="note">지금은 개념어 사전과 예시 작품이 들어 있어요. 모의고사 기출을 정리하면서 작품과 출제 이력이 계속 늘어나요.</div></section>`;
}

function filteredWorks(){
  let ws=D.works.filter(w=>(!S.g||w.genre===S.g)&&(!S.era||w.era===S.era)&&(!S.grade||workGrades(w).includes(S.grade)));
  if(S.sort==="abc") ws.sort((a,b)=>a.title.localeCompare(b.title,"ko"));
  else if(S.sort==="most") ws.sort((a,b)=>examCount(b)-examCount(a)||a.title.localeCompare(b.title,"ko"));
  else ws.sort((a,b)=>(b.added||"").localeCompare(a.added||"")||a.title.localeCompare(b.title,"ko"));
  return ws;
}
function vWorks(){
  const chip=(k,v,label,extra="")=>`<button class="chip${S[k]===v?" on":""}" data-k="${k}" data-v="${esc(v)}">${extra}${label}</button>`;
  const ws=filteredWorks();
  return `
  <div class="page-h"><h1>작품 사전</h1><p>줄거리, 표현 특징, 감상 포인트와 출제 이력을 정리했어요.</p></div>
  <div class="filters">
    <div class="frow"><span class="lab">갈래</span>${chip("g","","전체")}${GENRES.map(([g])=>chip("g",g,g,dot(g))).join("")}</div>
    <div class="frow"><span class="lab">시대</span>${chip("era","","전체")}${chip("era","고전","고전")}${chip("era","근현대","근현대")}</div>
    <div class="frow"><span class="lab">학년</span>${chip("grade","","전체")}${GRADES.map(g=>chip("grade",g,g)).join("")}</div>
  </div>
  <div class="bar"><span>${ws.length}편</span>
    <select id="sort" aria-label="정렬"><option value="new"${S.sort==="new"?" selected":""}>최근 추가 순</option><option value="abc"${S.sort==="abc"?" selected":""}>가나다 순</option><option value="most"${S.sort==="most"?" selected":""}>많이 나온 순</option></select></div>
  ${ws.length?`<div class="list">${ws.map(workCard).join("")}</div>`:`<div class="empty">조건에 맞는 작품이 아직 없어요.${S.grade?"<br>학년별 보기는 출제 이력이 채워지면 쓸 수 있어요.":""}</div>`}`;
}

function vWork(id){
  const w=WORK[id]; if(!w) return vNotFound();
  const exams=w.exams||[];
  const rel=(w.related||[]).map(r=>WORK[r]).filter(Boolean);
  const sameGenre=D.works.filter(x=>x.genre===w.genre&&x.id!==w.id).slice(0,4);
  const side=`<aside class="d-side">
    <div class="box"><h4>한눈에 보기</h4><dl class="kv"><dt>갈래</dt><dd>${esc(w.genre)}</dd>${(w.sheet||[]).map(s=>`<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>`).join("")}<dt>주제</dt><dd>${esc(w.theme)}</dd></dl></div>
    ${exams.length?`<div class="box"><h4>출제 요약</h4><dl class="kv"><dt>횟수</dt><dd>${exams.length}회</dd><dt>학년</dt><dd>${workGrades(w).join(", ")}</dd><dt>최근</dt><dd>${esc(examLabel(exams[0]))}</dd></dl></div>`:""}
  </aside>`;
  return `
  <div class="crumb"><a href="#works">작품 사전</a>${ICON.arrow.replace("<svg",'<svg width="14" height="14"')}<span>${esc(w.genre)}</span></div>
  <header class="d-head">
    <div class="meta">${dot(w.genre)}<span>${esc(w.genre)}</span><span>·</span><span>${esc(w.pub)}</span>${w.sample?`<span class="badge ex">예시 작품</span>`:""}</div>
    <h1>${esc(w.title)}</h1>
    <div class="by">${esc(w.author)}</div>
    <p class="lede">${esc(w.summary)}</p>
  </header>
  <div class="d-grid">
    <div class="d-main">
      ${w.words&&w.words.length?`<section><h2 class="h">핵심 시어·소재</h2><div class="words">${w.words.map(x=>`<div class="word"><b>${esc(x.w)}</b><span>${esc(x.m)}</span></div>`).join("")}</div></section>`:""}
      ${w.features&&w.features.length?`<section><h2 class="h">표현과 구성의 특징</h2><div class="feats">${w.features.map(f=>{const t=TERM[f.term];return `<div class="feat"><a class="t" href="#term-${f.term}">${esc(t?t.name:f.term)}</a><p>${esc(f.text)}</p></div>`}).join("")}</div></section>`:""}
      ${w.points&&w.points.length?`<section><h2 class="h">감상 포인트</h2><ol class="points">${w.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ol></section>`:""}
      ${w.original?`<section><h2 class="h">작품 원문</h2><div class="orig${w.era==="고전"?" old":""}">${esc(w.original)}<span class="src">${esc(w.author)}, 「${esc(w.title)}」 (${esc(w.pub)}). 저작권 보호 기간이 끝난 작품이에요.</span></div></section>`:""}
      <section><h2 class="h">출제 이력${exams.length?`<span class="num">${exams.length}</span>`:""}</h2>
      ${exams.length?`<div class="exams">${exams.map(e=>`<div class="exam"><b>${esc(examLabel(e))}</b><span>${esc(e.nums)}번</span>${e.with&&e.with.length?`<span class="with">함께 나온 작품: ${e.with.map(esc).join(", ")}</span>`:""}</div>`).join("")}</div>`
      :`<div class="pending">${ICON.clock}<div>아직 정리 중이에요. 모의고사 기출을 확인하면서 시행 연월과 문항 번호를 채워 넣을게요.</div></div>`}</section>
      ${rel.length?`<section><h2 class="h">함께 보면 좋은 작품</h2><div class="list">${rel.map(workCard).join("")}</div></section>`:""}
    </div>
    ${side}
  </div>
  ${sameGenre.length?`<section><div class="sec-h"><h2>같은 갈래의 다른 작품</h2></div><div class="list">${sameGenre.map(workCard).join("")}</div></section>`:""}`;
}

function vTerms(){
  const groups=[...new Set(D.terms.map(t=>t.group))];
  const ts=D.terms.filter(t=>!S.tg||t.group===S.tg);
  const by={}; ts.forEach(t=>(by[t.group]=by[t.group]||[]).push(t));
  return `
  <div class="page-h"><h1>개념어 사전</h1><p>선지에 자주 나오는 문학 용어를 뜻, 예시, 헷갈리는 짝, 선지 판단 연습으로 정리했어요.</p></div>
  <div class="filters"><div class="frow"><button class="chip${!S.tg?" on":""}" data-k="tg" data-v="">전체 <span class="n">${D.terms.length}</span></button>${groups.map(g=>`<button class="chip${S.tg===g?" on":""}" data-k="tg" data-v="${esc(g)}">${esc(g)} <span class="n">${D.terms.filter(t=>t.group===g).length}</span></button>`).join("")}</div></div>
  <div class="tlist">${Object.entries(by).map(([g,arr])=>`<div class="tgroup"><h2>${esc(g)}<small>${arr.length}개</small></h2><div class="trows">${arr.map(t=>`<a class="trow" href="#term-${t.id}"><b>${esc(t.name)}</b><span>${esc(t.short)}</span>${ICON.arrow}</a>`).join("")}</div></div>`).join("")}</div>`;
}

function vTerm(id){
  const t=TERM[id]; if(!t) return vNotFound();
  const ws=worksUsing(id);
  const same=D.terms.filter(x=>x.group===t.group&&x.id!==t.id);
  return `
  <div class="crumb"><a href="#terms">개념어 사전</a>${ICON.arrow.replace("<svg",'<svg width="14" height="14"')}<span>${esc(t.group)}</span></div>
  <header class="d-head">
    <div class="meta"><span>${esc(t.group)}</span></div>
    <h1>${esc(t.name)}</h1>
    <p class="t-short">${esc(t.short)}</p>
    ${t.alias&&t.alias.length?`<div class="alias">${t.alias.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div>`:""}
  </header>
  <div class="d-grid">
    <div class="d-main">
      <section><h2 class="h">뜻</h2><p class="desc">${esc(t.desc)}</p></section>
      ${t.ex?`<section><h2 class="h">예시</h2><div class="ex-box"><q>${esc(t.ex.text)}</q><cite>${esc(t.ex.src)}</cite></div></section>`:""}
      ${t.confuse&&t.confuse.length?`<section><h2 class="h">헷갈리는 짝</h2><div class="vs">${t.confuse.map(c=>{const o=TERM[c.term];return `<a href="#term-${c.term}"><div class="pair">${esc(t.name)}<em>vs</em>${esc(o?o.name:c.term)}</div><span>${esc(c.text)}</span></a>`}).join("")}</div></section>`:""}
      ${t.ox&&t.ox.length?`<section><h2 class="h">선지 판단 연습<span class="num">${t.ox.length}</span></h2><div class="ox">${t.ox.map((o,i)=>`<div class="oxq" data-i="${i}" data-ok="${o.ok?1:0}"><p>${esc(o.q)}</p><div class="oxb"><button type="button" data-a="1" aria-label="맞다">O</button><button type="button" data-a="0" aria-label="틀리다">X</button></div><div class="oxr" hidden><b>${o.ok?"O, 맞아요.":"X, 틀려요."}</b>${esc(o.why)}</div></div>`).join("")}</div></section>`:""}
    </div>
    <aside class="d-side">
      <div class="box"><h4>이 개념이 쓰인 작품</h4>${ws.length?`<div class="mini">${ws.map(w=>`<a href="#work-${w.id}">${dot(w.genre)}<b>${esc(w.title)}</b><small>${esc(w.author)}</small></a>`).join("")}</div>`:`<div style="color:var(--ink3);font-size:14px">작품이 늘어나면 여기에 모여요.</div>`}</div>
      ${same.length?`<div class="box"><h4>같은 묶음 · ${esc(t.group)}</h4><div class="tags" style="display:flex;flex-wrap:wrap;gap:6px">${same.map(x=>`<a class="tag" href="#term-${x.id}">${esc(x.name)}</a>`).join("")}</div></div>`:""}
    </aside>
  </div>`;
}
function vNotFound(){return `<div class="page-h"><h1>찾는 페이지가 없어요</h1><p><a href="#home" style="color:var(--accent)">처음으로 돌아가기</a></p></div>`}

/* router */
function route(){
  const h=decodeURIComponent(location.hash.slice(1))||"home";
  let html, nav="";
  if(h==="home") html=vHome();
  else if(h==="works"){html=vWorks();nav="works"}
  else if(h==="terms"){html=vTerms();nav="terms"}
  else if(h.startsWith("work-")){html=vWork(h.slice(5));nav="works"}
  else if(h.startsWith("term-")){html=vTerm(h.slice(5));nav="terms"}
  else html=vNotFound();
  $("#app").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===nav));
  const t=h.startsWith("work-")?WORK[h.slice(5)]:h.startsWith("term-")?TERM[h.slice(5)]:null;
  document.title=t?`${t.title||t.name} · 문학 마당`:"문학 마당";
  bind();
}
function bind(){
  bindSearch();
  document.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{S[b.dataset.k]=b.dataset.v;const y=scrollY;route();scrollTo(0,y)});
  const so=$("#sort"); if(so) so.onchange=()=>{S.sort=so.value;const y=scrollY;route();scrollTo(0,y)};
  document.querySelectorAll(".genre[data-g]").forEach(a=>a.onclick=()=>{S.g=a.dataset.g;S.era="";S.grade=""});
  document.querySelectorAll(".oxq").forEach(q=>q.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(q.classList.contains("done")) return;
    const right=b.dataset.a===q.dataset.ok;
    q.classList.add("done",right?"right":"wrong"); b.classList.add("pick"); q.querySelector(".oxr").hidden=false;
  }));
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});

$("#foot").innerHTML=`문학 마당 · 모의고사 문학 작품과 개념어 정리<br>문법은 <a href="${GRAMMAR_URL}" target="_blank" rel="noopener">국어 문법 마당</a>에서 공부해요. 저작권이 남아 있는 현대 작품은 원문 대신 요약과 짧은 인용만 실어요.`;

fetch("data.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  D=d; D.terms.forEach(t=>TERM[t.id]=t); D.works.forEach(w=>WORK[w.id]=w); route();
}).catch(()=>{$("#app").innerHTML=`<div class="page-h"><h1>자료를 불러오지 못했어요</h1><p>잠시 뒤 새로고침해 주세요.</p></div>`});

if("serviceWorker" in navigator && window.top===window && location.protocol==="https:" && !/claude/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
